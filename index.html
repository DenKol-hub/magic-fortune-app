<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Магический Салон</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f0c1b;
      --card-bg: #1c1830;
      --accent: #9d4edd;
      --accent-hover: #7b2cbf;
      --text: #f8f9fa;
      --text-muted: #a0a0b0;
      --border: #3c345c;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      padding-bottom: 70px;
    }

    /* Навигация (Табы) */
    .nav-tabs {
      display: flex;
      justify-content: space-around;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .tab-btn {
      flex: 1;
      padding: 14px 0;
      text-align: center;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.3s;
    }

    .tab-btn.active {
      color: var(--accent);
      border-bottom: 2px solid var(--accent);
    }

    .tab-content {
      display: none;
      padding: 16px;
    }

    .tab-content.active {
      display: block;
    }

    /* Карточки услуг */
    .service-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .service-title {
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 4px;
    }

    .service-price {
      color: var(--accent);
      font-weight: 700;
    }

    /* Формы */
    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: var(--text-muted);
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      box-sizing: border-box;
      font-size: 14px;
    }

    button.btn-primary {
      width: 100%;
      padding: 14px;
      background-color: var(--accent);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Сетка слотов созвона */
    .slots-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .slot-btn {
      padding: 8px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      text-align: center;
      font-size: 12px;
      cursor: pointer;
    }

    .slot-btn.selected {
      border-color: var(--accent);
      background-color: var(--accent);
    }

    /* Личный кабинет */
    .order-history-card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
    }

    .badge-pending { background: #ffb703; color: #000; }
    .badge-done { background: #38b000; color: #fff; }

    .reply-img {
      width: 100%;
      border-radius: 8px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <!-- Навигация -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('services')">🔮 Услуги</button>
    <button class="tab-btn" onclick="switchTab('profile')">👤 Кабинет</button>
  </div>

  <!-- Вкладка 1: Услуги и Оформление -->
  <div id="services-tab" class="tab-content active">
    <h3>Выберите расклад или консультацию</h3>
    
    <div class="service-card">
      <div>
        <div class="service-title">Расклад на Любовь</div>
        <div class="service-price">500 грн</div>
      </div>
      <input type="checkbox" class="service-checkbox" value="Расклад на Любовь" data-price="500">
    </div>

    <div class="service-card">
      <div>
        <div class="service-title">Финансовый Прогноз</div>
        <div class="service-price">700 грн</div>
      </div>
      <input type="checkbox" class="service-checkbox" value="Финансовый Прогноз" data-price="700">
    </div>

    <div class="service-card">
      <div>
        <div class="service-title">Онлайн-созвон (30 мин)</div>
        <div class="service-price">1200 грн</div>
      </div>
      <input type="checkbox" id="call-service" class="service-checkbox" value="Онлайн-созвон" data-price="1200" onchange="toggleSlots()">
    </div>

    <!-- Блок выбора слота для созвона (скрыт по умолчанию) -->
    <div id="slots-block" class="form-group" style="display: none;">
      <label>Выберите дату созвона:</label>
      <input type="date" id="slot-date" onchange="loadSlots()">
      <div id="slots-container" class="slots-grid"></div>
    </div>

    <hr style="border-color: var(--border); margin: 20px 0;">

    <form id="order-form">
      <div class="form-group">
        <label>Ваше Имя:</label>
        <input type="text" id="client-name" required placeholder="Анна">
      </div>

      <div class="form-group">
        <label>Дата рождения (ДД.ММ.ГГГГ):</label>
        <input type="text" id="client-dob" required placeholder="15.08.1995">
      </div>

      <div class="form-group">
        <label>Ваш вопрос или ситуация:</label>
        <textarea id="client-question" rows="3" placeholder="Опишите, что вас интересует..."></textarea>
      </div>

      <div class="form-group">
        <label>Прикрепить ваше фото (необязательно):</label>
        <input type="file" id="client-photo" accept="image/*">
      </div>

      <button type="button" class="btn-primary" onclick="submitOrder()">Заказать (<span id="total-price">0</span> грн)</button>
    </form>
  </div>

  <!-- Вкладка 2: Личный Кабинет -->
  <div id="profile-tab" class="tab-content">
    <h3>Личный Кабинет</h3>
    <div id="user-info" style="color: var(--text-muted); margin-bottom: 16px;">Загрузка...</div>
    
    <h4>История ваших заказов:</h4>
    <div id="orders-history"></div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const API_URL = window.location.origin; // Ссылка на сервер Flask
    let selectedSlotId = null;

    // Переключение вкладок
    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      if(tabName === 'services') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('services-tab').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('profile-tab').classList.add('active');
        loadUserProfile();
      }
    }

    // Подсчет итоговой суммы
    document.querySelectorAll('.service-checkbox').forEach(cb => {
      cb.addEventListener('change', () => {
        let total = 0;
        document.querySelectorAll('.service-checkbox:checked').forEach(c => {
          total += parseInt(c.dataset.price);
        });
        document.getElementById('total-price').innerText = total;
      });
    });

    // Показать/скрыть выбор слотов
    function toggleSlots() {
      const isCallChecked = document.getElementById('call-service').checked;
      document.getElementById('slots-block').style.display = isCallChecked ? 'block' : 'none';
    }

    // Загрузка слотов времени
    async function loadSlots() {
      const date = document.getElementById('slot-date').value;
      if (!date) return;
      
      const res = await fetch(`${API_URL}/api/slots?date=${date}`);
      const slots = await res.json();
      const container = document.getElementById('slots-container');
      container.innerHTML = '';

      slots.forEach(slot => {
        const btn = document.createElement('div');
        btn.className = 'slot-btn';
        btn.innerText = slot.time;
        btn.onclick = () => {
          document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          selectedSlotId = slot.id;
        };
        container.appendChild(btn);
      });
    }

    // Отправка заказа
    async function submitOrder() {
      const userId = tg.initDataUnsafe?.user?.id || 123456; // Fallback для тестов
      const username = tg.initDataUnsafe?.user?.username || '';
      
      const selectedServices = [];
      let totalAmount = 0;
      document.querySelectorAll('.service-checkbox:checked').forEach(c => {
        selectedServices.push(c.value);
        totalAmount += parseInt(c.dataset.price);
      });

      if (selectedServices.length === 0) {
        alert("Выберите хотя бы одну услугу!");
        return;
      }

      const formData = new FormData();
      formData.append('user_id', userId);
      formData.append('username', username);
      formData.append('client_name', document.getElementById('client-name').value);
      formData.append('client_dob', document.getElementById('client-dob').value);
      formData.append('client_question', document.getElementById('client-question').value);
      formData.append('services', selectedServices.join(', '));
      formData.append('total_amount', totalAmount);
      
      if (selectedSlotId) formData.append('slot_id', selectedSlotId);
      
      const photoFile = document.getElementById('client-photo').files[0];
      if (photoFile) formData.append('client_photo', photoFile);

      try {
        const res = await fetch(`${API_URL}/api/order`, {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        
        if (data.status === 'ok') {
          tg.close();
        } else {
          alert("Ошибка: " + data.message);
        }
      } catch (err) {
        alert("Ошибка сети или сервера");
      }
    }

    // Загрузка Личного Кабинета
    async function loadUserProfile() {
      const userId = tg.initDataUnsafe?.user?.id || 123456;
      const res = await fetch(`${API_URL}/api/user/profile?user_id=${userId}`);
      const data = await res.json();

      document.getElementById('user-info').innerText = `Имя: ${data.name || 'Не указано'} | ДР: ${data.dob || '-'}`;
      
      const historyContainer = document.getElementById('orders-history');
      historyContainer.innerHTML = '';

      if (!data.orders || data.orders.length === 0) {
        historyContainer.innerHTML = '<p>У вас пока нет заказов</p>';
        return;
      }

      data.orders.forEach(o => {
        const card = document.createElement('div');
        card.className = 'order-history-card';
        
        let messagesHTML = '';
        if (o.messages && o.messages.length > 0) {
          messagesHTML = '<strong>Ответы:</strong><br>';
          o.messages.forEach(m => {
            messagesHTML += `<p>🔮 ${m.text}</p>`;
            if (m.photo_url) {
              messagesHTML += `<img src="${API_URL}${m.photo_url}" class="reply-img">`;
            }
          });
        }

        card.innerHTML = `
          <div style="display:flex; justify-content:space-between;">
            <strong>Заказ #${o.order_id}</strong>
            <span class="badge ${o.status === 'Виконано' ? 'badge-done' : 'badge-pending'}">${o.status}</span>
          </div>
          <p style="margin: 6px 0; font-size:13px; color:var(--text-muted);">${o.services.join(', ')}</p>
          ${messagesHTML}
        `;
        historyContainer.appendChild(card);
      });
    }
  </script>
</body>
</html>
