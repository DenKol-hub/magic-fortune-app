<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ Панель</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #f7f4ee;
            --card-bg: #ffffff;
            --btn-gold: #c6a258;
            --text-main: #2b2825;
            --text-muted: #726c65;
            --danger-color: #e74c3c;
            --border-color: #eee9e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 16px;
            box-sizing: border-box;
        }

        .header { text-align: center; margin-bottom: 20px; }
        .header h2 {
            font-size: 18px; margin: 0; color: #4a3366;
            background: rgba(191, 168, 226, 0.25);
            display: inline-block; padding: 6px 16px; border-radius: 20px;
        }

        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;
        }
        .stat-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            padding: 12px; border-radius: 12px; text-align: center;
        }
        .stat-val { font-size: 18px; font-weight: bold; color: var(--btn-gold); }
        .stat-lbl { font-size: 11px; color: var(--text-muted); }

        .section-title { font-size: 14px; font-weight: bold; margin: 16px 0 8px 0; text-transform: uppercase; color: var(--text-muted); }

        .order-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 14px; padding: 14px; margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .order-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 14px; margin-bottom: 6px; }
        .order-info { font-size: 12px; color: var(--text-muted); line-height: 1.4; margin-bottom: 10px; }
        
        .actions { display: flex; gap: 8px; }
        .btn {
            flex: 1; border: none; padding: 8px; border-radius: 8px;
            font-weight: bold; font-size: 12px; cursor: pointer; text-align: center;
        }
        .btn-reply { background: var(--btn-gold); color: white; }
        .btn-ban { background: var(--danger-color); color: white; }

        .ban-input-box {
            display: flex; gap: 8px; margin-bottom: 16px;
        }
        .ban-input-box input {
            flex: 1; padding: 10px; border: 1px solid var(--border-color);
            border-radius: 8px; outline: none; background: var(--card-bg);
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>👑 Панель Управления</h2>
    </div>

    <!-- СТАТИСТИКА -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-val" id="st-revenue">0 грн</div>
            <div class="stat-lbl">Общий доход</div>
        </div>
        <div class="stat-card">
            <div class="stat-val" id="st-orders">0</div>
            <div class="stat-lbl">Заказов выполнено</div>
        </div>
    </div>

    <!-- БАН ПО ID -->
    <div class="section-title">⛔ Управление Банами</div>
    <div class="ban-input-box">
        <input type="number" id="ban-id-input" placeholder="Введите Telegram ID">
        <button class="btn btn-ban" onclick="manualBan('ban')">Забанить</button>
        <button class="btn btn-reply" onclick="manualBan('unban')">Разбанить</button>
    </div>

    <!-- АКТИВНЫЕ ЗАКАЗЫ -->
    <div class="section-title">📋 Активные заказы</div>
    <div id="orders-container">
        <p style="text-align: center; color: var(--text-muted); font-size: 13px;">Загрузка заказов...</p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ⚠️ ВАШ URL БЭКЕНДА
        const BACKEND_URL = "https://magic-bot-backend-ym8f.onrender.com";

        async function loadAdminData() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/admin/data`);
                const data = await res.json();

                // Статистика
                document.getElementById('st-revenue').innerText = `${data.stats.total_revenue} грн`;
                document.getElementById('st-orders').innerText = data.stats.total_orders;

                // Заказы
                const container = document.getElementById('orders-container');
                container.innerHTML = '';

                if (data.active_orders.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: var(--text-muted); font-size: 13px;">Активных заказов нет 🎉</p>';
                    return;
                }

                data.active_orders.forEach(order => {
                    const card = document.createElement('div');
                    card.className = 'order-card';
                    card.innerHTML = `
                        <div class="order-header">
                            <span>${order.name} (${order.username})</span>
                            <span style="color: var(--btn-gold);">${order.total} грн</span>
                        </div>
                        <div class="order-info">
                            <b>ID:</b> ${order.user_id} | <b>Возраст:</b> ${order.age} (ДР: ${order.dob})<br>
                            <b>Услуги:</b> ${order.services.join(', ')}<br>
                            <b>Вопрос:</b> <i>${order.question}</i>
                        </div>
                        <div class="actions">
                            <button class="btn btn-ban" onclick="banUser(${order.user_id})">Забанить</button>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (err) {
                console.error(err);
            }
        }

        async function banUser(userId) {
            if (!confirm(`Заблокировать пользователя ID: ${userId}?`)) return;

            await fetch(`${BACKEND_URL}/api/admin/ban`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, action: 'ban' })
            });

            loadAdminData();
        }

        async function manualBan(action) {
            const input = document.getElementById('ban-id-input');
            const uid = input.value.trim();
            if (!uid) return alert("Введите ID");

            await fetch(`${BACKEND_URL}/api/admin/ban`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: uid, action: action })
            });

            alert(`Пользователь ${uid} -> ${action}`);
            input.value = '';
            loadAdminData();
        }

        loadAdminData();
        setInterval(loadAdminData, 10000); // Автообновление каждые 10 сек
    </script>
</body>
</html>
