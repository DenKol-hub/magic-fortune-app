<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таємниці Долі</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #f7f4ee;         /* Молочно-кремовый фон */
            --card-bg: #ffffff;         /* Белые карточки */
            --card-shadow: rgba(180, 170, 160, 0.15); /* Легкая тень */
            --btn-gold: #c6a258;        /* Матовое золото */
            --btn-gold-hover: #b59247;  
            --text-main: #2b2825;       /* Темный графитовый */
            --text-muted: #726c65;      /* Приглушенный */
            --accent-lavender: #bfa8e2;  /* Нежная лаванда */
            --border-color: #eee9e0;     
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
            margin-top: 8px;
        }

        .header h2 {
            font-size: 16px;
            font-weight: 600;
            margin: 0 0 10px 0;
            color: #4a3366;
            background: rgba(191, 168, 226, 0.25);
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
        }

        .header p {
            font-size: 13px;
            color: var(--text-muted);
            margin: 0;
            font-style: italic;
            line-height: 1.4;
        }

        .services-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .service-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--card-shadow);
        }

        .service-card input[type="checkbox"] {
            margin-top: 3px;
            accent-color: var(--btn-gold);
            width: 18px;
            height: 18px;
        }

        .service-info { flex-grow: 1; }

        .service-title {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 4px;
            color: var(--text-main);
        }

        .service-desc {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.3;
        }

        .service-price {
            font-weight: 700;
            color: var(--btn-gold);
            font-size: 15px;
            white-space: nowrap;
        }

        .form-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 90px;
            box-shadow: 0 4px 12px var(--card-shadow);
        }

        .form-section h3 {
            font-size: 13px;
            margin: 0 0 12px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .input-group { margin-bottom: 12px; }

        .input-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 4px;
            color: var(--text-muted);
        }

        .input-group input, .input-group textarea {
            width: 100%;
            padding: 11px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }

        .footer-action {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--bg-color);
            border-top: 1px solid var(--border-color);
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-price {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
        }

        .btn-submit {
            background-color: var(--btn-gold);
            color: #ffffff;
            font-weight: 600;
            border: none;
            padding: 12px 22px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }

        /* --- МОДАЛЬНОЕ ОКНО --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        .modal-card h3 {
            margin-top: 0;
            color: var(--text-main);
        }

        .card-number-box {
            background: var(--bg-color);
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            margin: 12px 0 6px 0;
            border: 1px dashed var(--btn-gold);
            color: var(--text-main);
            word-break: break-all;
            cursor: pointer;
        }

        .card-hint {
            font-size: 11px;
            color: var(--btn-gold);
            margin-bottom: 14px;
        }

        /* Блок загрузки файла внутри модалки */
        .file-upload-box {
            position: relative;
            background-color: var(--bg-color);
            border: 1px dashed var(--btn-gold);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 14px;
        }

        .file-upload-box input[type="file"] {
            position: absolute;
            left: 0; top: 0; width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .file-upload-text {
            font-size: 12px;
            color: var(--text-muted);
        }

        .file-preview-name {
            font-size: 11px;
            color: var(--btn-gold);
            font-weight: 600;
            margin-top: 4px;
            word-break: break-all;
        }

        .btn-modal-pay {
            background-color: var(--btn-gold);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .btn-modal-close {
            background: transparent;
            color: var(--text-muted);
            border: none;
            cursor: pointer;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Вас вітає Корнелія 👩🏻‍💻</h2>
        <p>Ваші відповіді вже існують. Залишилося лише поставити правильне запитання.</p>
    </div>

    <div class="services-list">
        <label class="service-card">
            <input type="checkbox" value="150" data-name="Любов і стосунки" onchange="calculateTotal()">
            <div class="service-info">
                <div class="service-title">❤️ Любов і стосунки</div>
                <div class="service-desc">Почуття, наміри, перспектива розвитку взаємин</div>
            </div>
            <div class="service-price">150 грн</div>
        </label>

        <label class="service-card">
            <input type="checkbox" value="100" data-name="Кар’єра та фінанси" onchange="calculateTotal()">
            <div class="service-info">
                <div class="service-title">💰 Кар’єра та фінанси</div>
                <div class="service-desc">Робота, покликання, нові можливості та фінансовий потік</div>
            </div>
            <div class="service-price">100 грн</div>
        </label>

        <label class="service-card">
            <input type="checkbox" value="200" data-name="Карма та призначення" onchange="calculateTotal()">
            <div class="service-info">
                <div class="service-title">🌙 Карма та призначення</div>
                <div class="service-desc">Життєві уроки, духовний шлях і призначення душі</div>
            </div>
            <div class="service-price">200 грн</div>
        </label>

        <label class="service-card">
            <input type="checkbox" value="300" data-name="Великий прогноз на 3 місяці" onchange="calculateTotal()">
            <div class="service-info">
                <div class="service-title">✨ Великий прогноз на 3 місяці</div>
                <div class="service-desc">Детальний прогноз на всі сфери життя</div>
            </div>
            <div class="service-price">300 грн</div>
        </label>
    </div>

    <div class="form-section">
        <h3>Дані для розкладу</h3>
        <div class="input-group">
            <label>Ваше ім'я *</label>
            <input type="text" id="client-name" placeholder="Наприклад: Анна">
        </div>
        <div class="input-group">
            <label>Дата народження *</label>
            <input type="text" id="client-dob" placeholder="ДД.ММ.ГГГГ">
        </div>
        <div class="input-group">
            <label>Ваше запитання (за бажанням)</label>
            <textarea id="client-question" rows="2" placeholder="Опишіть ваші думки або конкретну ситуацію..."></textarea>
        </div>
    </div>

    <div class="footer-action">
        <div class="total-price">Разом: <span id="total-val">0</span> грн</div>
        <button class="btn-submit" id="submit-btn" onclick="openPaymentModal()">Перейти до оплати</button>
    </div>

    <!-- Модальное окно Реквизитов и Загрузки чека -->
    <div class="modal-overlay" id="payment-modal">
        <div class="modal-card">
            <h3>💳 Реквізити для оплати</h3>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 8px;">Перекажіть суму <strong id="modal-sum">0</strong> грн на карту:</p>
            
            <div class="card-number-box" onclick="copyCard()">
                4441 1110 5176 5877
            </div>
            <div class="card-hint">Натисніть, щоб скопіювати номер карти</div>

            <!-- Блок для прикрепления квитанции прямо тут -->
            <div class="file-upload-box">
                <input type="file" id="receipt-file" accept="image/*,.pdf" onchange="handleFileSelect(event)">
                <div class="file-upload-text" id="upload-status">📎 Прикріпити чек / квитанцію *</div>
                <div class="file-preview-name" id="file-name-preview"></div>
            </div>

            <button class="btn-modal-pay" id="confirm-pay-btn" onclick="sendOrder()">Підтверджую оплату та надсилаю</button>
            <button class="btn-modal-close" onclick="closePaymentModal()">Скасувати</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let base64Receipt = null;
        let receiptFileName = "";

        function calculateTotal() {
            const checkboxes = document.querySelectorAll('.service-card input[type="checkbox"]:checked');
            let total = 0;
            checkboxes.forEach(cb => {
                total += parseInt(cb.value);
            });
            document.getElementById('total-val').innerText = total;
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.size > 7 * 1024 * 1024) {
                alert("Файл занадто великий. Завантажте квитанцію розміром до 7 МБ.");
                event.target.value = "";
                return;
            }

            receiptFileName = file.name;
            const reader = new FileReader();
            reader.onload = function(e) {
                base64Receipt = e.target.result;
                document.getElementById('upload-status').innerText = "✅ Квитанцію прикріплено:";
                document.getElementById('file-name-preview').innerText = file.name;
            };
            reader.readAsDataURL(file);
        }

        function openPaymentModal() {
            const name = document.getElementById('client-name').value.trim();
            const dob = document.getElementById('client-dob').value.trim();
            const selectedCheckboxes = document.querySelectorAll('.service-card input[type="checkbox"]:checked');

            if (selectedCheckboxes.length === 0) {
                alert("Будь ласка, оберіть хоча б одну послугу.");
                return;
            }

            if (!name || !dob) {
                alert("Будь ласка, вкажіть ваше ім'я та дату народження.");
                return;
            }

            let total = 0;
            selectedCheckboxes.forEach(cb => {
                total += parseInt(cb.value);
            });

            document.getElementById('modal-sum').innerText = total;
            document.getElementById('payment-modal').style.display = 'flex';
        }

        function closePaymentModal() {
            document.getElementById('payment-modal').style.display = 'none';
        }

        function copyCard() {
            const cardNum = "4441111051765877";
            navigator.clipboard.writeText(cardNum).then(() => {
                alert("Номер карти скопійовано!");
            }).catch(() => {
                const input = document.createElement("input");
                input.value = cardNum;
                document.body.appendChild(input);
                input.select();
                document.execCommand("copy");
                document.body.removeChild(input);
                alert("Номер карти скопійовано!");
            });
        }

        function sendOrder() {
            if (!base64Receipt) {
                alert("Будь ласка, прикріпіть квитанцію про оплату!");
                return;
            }

            const confirmBtn = document.getElementById('confirm-pay-btn');
            confirmBtn.disabled = true;
            confirmBtn.innerText = "Надсилання...";

            const name = document.getElementById('client-name').value.trim();
            const dob = document.getElementById('client-dob').value.trim();
            const question = document.getElementById('client-question').value.trim();
            const selectedCheckboxes = document.querySelectorAll('.service-card input[type="checkbox"]:checked');

            let selectedServices = [];
            let total = 0;
            selectedCheckboxes.forEach(cb => {
                selectedServices.push(cb.getAttribute('data-name'));
                total += parseInt(cb.value);
            });

            const payload = {
                client_name: name,
                client_dob: dob,
                client_question: question || "Без питання",
                services: selectedServices,
                total_amount: total,
                receipt_base64: base64Receipt,
                receipt_filename: receiptFileName
            };

            tg.sendData(JSON.stringify(payload));
        }
    </script>
</body>
</html>
