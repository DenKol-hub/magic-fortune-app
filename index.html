<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таємниці Долі | Головна</title>
    <style>
        :root {
            --bg-color: #f7f4ee;
            --card-bg: #ffffff;
            --card-shadow: rgba(180, 170, 160, 0.2);
            --btn-gold: #c6a258;
            --btn-gold-hover: #b59247;
            --text-main: #2b2825;
            --text-muted: #726c65;
            --border-color: #e6dfd3;
            --accent-purple: #4a3366;
            --accent-lavender: #bfa8e2;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        /* Переключатель вкладок */
        .tabs-nav {
            display: flex;
            background: var(--border-color);
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 10px;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: var(--accent-purple);
            box-shadow: 0 2px 8px var(--card-shadow);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h2 {
            font-size: 16px;
            font-weight: 600;
            margin: 0;
            color: var(--accent-purple);
            background: rgba(191, 168, 226, 0.3);
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
        }

        .section-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 10px;
            margin-top: 16px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--btn-gold);
        }

        .services-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .service-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 16px;
            box-shadow: 0 4px 12px var(--card-shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .service-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .service-card input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--btn-gold);
            cursor: pointer;
        }

        .service-info .title {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-main);
        }

        .service-info .desc {
            font-size: 12px;
            color: var(--text-muted);
        }

        .service-price {
            font-weight: 700;
            color: var(--btn-gold);
            font-size: 14px;
        }

        /* Календарь на неделю */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-bottom: 16px;
        }

        .calendar-day {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 2px;
            text-align: center;
            font-size: 11px;
            cursor: pointer;
        }

        .calendar-day.selected {
            background: var(--accent-lavender);
            border-color: var(--accent-purple);
            color: var(--accent-purple);
            font-weight: 700;
        }

        /* Слоты времени с шагом 20 минут */
        .time-slots {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 16px;
        }

        .time-slot {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }

        .time-slot.selected {
            background: var(--btn-gold);
            color: white;
            border-color: var(--btn-gold);
            font-weight: 600;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--btn-gold);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(198, 162, 88, 0.3);
            margin-top: 10px;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 4px 12px var(--card-shadow);
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

    <!-- Вкладки-переключатели -->
    <div class="tabs-nav">
        <div class="tab-btn active" onclick="switchTab('order', this)">Запис на розклад</div>
        <div class="tab-btn" onclick="switchTab('cabinet', this)">Особистий кабінет</div>
    </div>

    <!-- ВКЛАДКА 1: ЗАКАЗ -->
    <div id="tab-order" class="tab-content active">
        <div class="header">
            <h2>Вас вітає Корнелія ✨</h2>
        </div>

        <div class="form-group">
            <div class="section-title">Ваші дані</div>
            <input type="text" class="form-input" placeholder="Ваше ім'я" id="client-name">
        </div>
        <div class="form-group">
            <input type="email" class="form-input" placeholder="Email (для входу в кабінет)" id="client-email">
        </div>
        <div class="form-group">
            <input type="text" class="form-input" placeholder="Дата народження (ДД.ММ.РРРР)" id="client-dob">
        </div>

        <div class="section-title">Оберіть послуги</div>
        <div class="services-list">
            <label class="service-card">
                <div class="service-left">
                    <input type="checkbox" name="service" value="250" data-name="Любов і стосунки">
                    <div class="service-info">
                        <div class="title">Любов і стосунки</div>
                        <div class="desc">Аналіз почуттів та сумісності</div>
                    </div>
                </div>
                <div class="service-price">250 грн</div>
            </label>

            <label class="service-card">
                <div class="service-left">
                    <input type="checkbox" name="service" value="250" data-name="Кар’єра та фінанси">
                    <div class="service-info">
                        <div class="title">Кар’єра та фінанси</div>
                        <div class="desc">Перспективи заробітку і росту</div>
                    </div>
                </div>
                <div class="service-price">250 грн</div>
            </label>

            <label class="service-card">
                <div class="service-left">
                    <input type="checkbox" name="service" value="300" data-name="Великий прогноз">
                    <div class="service-info">
                        <div class="title">Великий прогноз</div>
                        <div class="desc">Розклад на найближчі 3 місяці</div>
                    </div>
                </div>
                <div class="service-price">300 грн</div>
            </label>
        </div>

        <div class="section-title">Оберіть день (ближчий тиждень)</div>
        <div class="calendar-grid" id="calendar-days"></div>

        <div class="section-title">Оберіть час (інтервал 20 хв)</div>
        <div class="time-slots" id="time-slots">
            <div class="time-slot" onclick="selectTime(this)">12:00</div>
            <div class="time-slot" onclick="selectTime(this)">12:20</div>
            <div class="time-slot" onclick="selectTime(this)">12:40</div>
            <div class="time-slot" onclick="selectTime(this)">13:00</div>
            <div class="time-slot" onclick="selectTime(this)">13:20</div>
            <div class="time-slot" onclick="selectTime(this)">13:40</div>
            <div class="time-slot" onclick="selectTime(this)">15:00</div>
            <div class="time-slot" onclick="selectTime(this)">15:20</div>
        </div>

        <div class="form-group">
            <div class="section-title">Ваше запитання</div>
            <input type="text" class="form-input" placeholder="Напишіть головне питання..." id="client-question">
        </div>

        <button class="btn-submit" onclick="alert('Перехід до оплати...')">Далі до оплати</button>
    </div>

    <!-- ВКЛАДКА 2: КАБИНЕТ -->
    <div id="tab-cabinet" class="tab-content">
        <div class="header">
            <h2>Особистий кабінет 🔮</h2>
        </div>
        <div class="card-box" style="text-align: center;">
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px;">Введіть ваш Email для верифікації:</p>
            <input type="email" class="form-input" placeholder="Ваш Email" id="cab-email" style="margin-bottom: 10px;">
            <button class="btn-submit" onclick="alert('Авторизація успішна!')">Увійти в кабінет</button>
        </div>
    </div>

    <script>
        function switchTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            el.classList.add('active');
        }

        let selectedTimeSlot = '';
        function selectTime(el) {
            document.querySelectorAll('.time-slot').forEach(s => s.classList.remove('selected'));
            el.classList.add('selected');
            selectedTimeSlot = el.textContent;
        }

        // Календарь на 7 дней
        const calendarContainer = document.getElementById('calendar-days');
        const daysOfWeek = ['Нд', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
        const today = new Date();
        for (let i = 0; i < 7; i++) {
            let d = new Date();
            d.setDate(today.getDate() + i);
            let dayDiv = document.createElement('div');
            dayDiv.className = 'calendar-day' + (i === 0 ? ' selected' : '');
            dayDiv.innerHTML = `${daysOfWeek[d.getDay()]}<br><b>${d.getDate()}</b>`;
            dayDiv.onclick = function() {
                document.querySelectorAll('.calendar-day').forEach(el => el.classList.remove('selected'));
                this.classList.add('selected');
            };
            calendarContainer.appendChild(dayDiv);
        }
    </script>
</body>
</html>
