<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таємниці Долі | Головна</title>
    <style>
        :root {
            --bg-color: #f7f4ee;
            --card-bg: #ffffff;
            --card-shadow: rgba(180, 170, 160, 0.2);
            --btn-gold: #c6a258;
            --btn-gold-hover: #b59247;
            --text-main: #2b2825;
            --text-muted: #726c65;
            --border-color: #e6dfd3;
            --accent-purple: #4a3366;
            --accent-lavender: #bfa8e2;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
            margin-top: 8px;
        }

        .header h2 {
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 6px 0;
            color: var(--accent-purple);
            background: rgba(191, 168, 226, 0.3);
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
        }

        .section-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 10px;
            margin-top: 16px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: var(--btn-gold);
        }

        .services-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .service-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 16px;
            box-shadow: 0 4px 12px var(--card-shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .service-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .service-card input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--btn-gold);
            cursor: pointer;
        }

        .service-info .title {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-main);
        }

        .service-info .desc {
            font-size: 12px;
            color: var(--text-muted);
        }

        .service-price {
            font-weight: 700;
            color: var(--btn-gold);
            font-size: 14px;
        }

        /* Календарь на неделю */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-bottom: 16px;
        }

        .calendar-day {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 4px;
            text-align: center;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .calendar-day.selected {
            background: var(--accent-lavender);
            border-color: var(--accent-purple);
            color: var(--accent-purple);
            font-weight: 700;
        }

        .time-slots {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 16px;
        }

        .time-slot {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }

        .time-slot.selected {
            background: var(--btn-gold);
            color: white;
            border-color: var(--btn-gold);
            font-weight: 600;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--btn-gold);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(198, 162, 88, 0.3);
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--btn-gold-hover);
        }

        /* Экраны скрытия */
        #payment-screen {
            display: none;
        }

        .requisites-box {
            background: rgba(198, 162, 88, 0.1);
            border: 1px dashed var(--btn-gold);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 16px;
            font-size: 14px;
            text-align: center;
        }

        .file-upload {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            background: var(--card-bg);
            cursor: pointer;
            margin-bottom: 16px;
            display: block;
        }
        .file-upload input { display: none; }
    </style>
</head>
<body>

    <!-- ФОРМА ЗАКАЗА -->
    <div id="order-screen">
        <div class="header">
            <h2>Таємниці Долі ✨</h2>
        </div>

        <div class="form-group">
            <div class="section-title">Ваші дані</div>
            <input type="text" class="form-input" placeholder="Ваше ім'я" id="client-name">
        </div>
        <div class="form-group">
            <input type="email" class="form-input" placeholder="Email (для входу в кабінет)" id="client-email">
        </div>
        <div class="form-group">
            <input type="text" class="form-input" placeholder="Дата народження (ДД.ММ.РРРР)" id="client-dob">
        </div>

        <div class="section-title">Оберіть послуги</div>
        <div class="services-list" id="services-container">
            <!-- Динамически загружается с бэка -->
        </div>

        <div class="section-title">Оберіть день (ближчий тиждень)</div>
        <div class="calendar-grid" id="calendar-days">
            <!-- Дни генерируются скриптом -->
        </div>

        <div class="section-title">Оберіть час</div>
        <div class="time-slots" id="time-slots">
            <div class="time-slot" onclick="selectTime(this)">12:00</div>
            <div class="time-slot" onclick="selectTime(this)">15:00</div>
            <div class="time-slot" onclick="selectTime(this)">18:00</div>
            <div class="time-slot" onclick="selectTime(this)">20:00</div>
        </div>

        <div class="form-group">
            <div class="section-title">Ваше запитання</div>
            <input type="text" class="form-input" placeholder="Напишіть головне питання..." id="client-question">
        </div>

        <button class="btn-submit" onclick="proceedToPayment()">Далі до оплати</button>
    </div>

    <!-- ЭКРАН ОПЛАТЫ И КВИТАНЦИИ -->
    <div id="payment-screen">
        <div class="header">
            <h2>Оплата послуг 💳</h2>
        </div>
        <div class="requisites-box">
            <b>Сума до сплати: <span id="payment-total">0</span> грн</b><br><br>
            Картка Monobank / ПриватБанк:<br>
            <b>4441 1111 2222 3333</b><br>
            Отримувач: Таємниці Долі
        </div>

        <div class="section-title">Надіслати квитанцію</div>
        <label class="file-upload">
            <span id="file-label">📎 Натисніть, щоб завантажити скрін квитанції</span>
            <input type="file" id="receipt-file" accept="image/*" onchange="handleFileSelect(this)">
        </label>

        <button class="btn-submit" onclick="submitOrderAndReceipt()">Я оплатив (-ла), надіслати</button>
    </div>

    <script>
        let selectedTimeSlot = '';
        let currentOrderId = null;

        // Генерация календаря на 7 дней вперед
        const calendarContainer = document.getElementById('calendar-days');
        const daysOfWeek = ['Нд', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
        const today = new Date();
        
        for (let i = 0; i < 7; i++) {
            let d = new Date();
            d.setDate(today.getDate() + i);
            let dayDiv = document.createElement('div');
            dayDiv.className = 'calendar-day' + (i === 0 ? ' selected' : '');
            dayDiv.innerHTML = `${daysOfWeek[d.getDay()]}<br><b>${d.getDate()}</b>`;
            dayDiv.onclick = function() {
                document.querySelectorAll('.calendar-day').forEach(el => el.classList.remove('selected'));
                this.classList.add('selected');
            };
            calendarContainer.appendChild(dayDiv);
        }

        function selectTime(el) {
            document.querySelectorAll('.time-slot').forEach(s => s.classList.remove('selected'));
            el.classList.add('selected');
            selectedTimeSlot = el.textContent;
        }

        // Загрузка услуг с бэка
        fetch('/api/services')
            .then(res => res.json())
            .then(services => {
                const container = document.getElementById('services-container');
                services.forEach(s => {
                    container.innerHTML += `
                        <label class="service-card">
                            <div class="service-left">
                                <input type="checkbox" name="service" value="${s.id}" data-price="${s.price}">
                                <div class="service-info">
                                    <div class="title">${s.title}</div>
                                </div>
                            </div>
                            <div class="service-price">${s.price} грн</div>
                        </label>
                    `;
                });
            });

        function proceedToPayment() {
            const name = document.getElementById('client-name').value;
            const email = document.getElementById('client-email').value;
            const dob = document.getElementById('client-dob').value;
            const question = document.getElementById('client-question').value;
            
            const checked = document.querySelectorAll('input[name="service"]:checked');
            if (!name || !email) { alert('Введіть ім\'я та email'); return; }
            if (checked.length === 0) { alert 'Оберіть хоча б одну послугу'; return; }
            if (!selectedTimeSlot) { alert('Оберіть час'); return; }

            let serviceIds = Array.from(checked).map(cb => parseInt(cb.value));

            // Отправляем заказ на бэк для фиксации цен и создания брони
            fetch('/api/order', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name, email, dob, service_ids: serviceIds, question, slot_time: selectedTimeSlot })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    currentOrderId = data.order_id;
                    document.getElementById('payment-total').textContent = data.total_price;
                    document.getElementById('order-screen').style.display = 'none';
                    document.getElementById('payment-screen').style.display = 'block';
                } else {
                    alert(data.error || 'Помилка');
                }
            });
        }

        function handleFileSelect(input) {
            if (input.files && input.files[0]) {
                document.getElementById('file-label').textContent = '✓ Обрано: ' + input.files[0].name;
            }
        }

        function submitOrderAndReceipt() {
            const fileInput = document.getElementById('receipt-file');
            if (!fileInput.files.length) { alert('Завантажте квитанцію'); return; }

            const formData = new FormData();
            formData.append('receipt', fileInput.files[0]);

            fetch(`/api/order/${currentOrderId}/receipt`, {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    alert('Квитанцію успішно надіслано! Переходимо в особистий кабінет.');
                    window.location.href = 'cabinet.html';
                }
            });
        }
    </script>
</body>
</html>
