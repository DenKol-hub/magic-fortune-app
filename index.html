<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Современный мистицизм - Таємниці Долі</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            /* Новая палитра */
            --bg-color: #f7f4ee;         /* Молочно-кремовый фон */
            --card-bg: #ffffff;         /* Очень светлый бежевый/белый */
            --card-shadow: rgba(180, 170, 160, 0.15); /* Легкая мягкая тень */
            --btn-gold: #c6a258;        /* Матовое золото */
            --btn-gold-hover: #b59247;  
            --text-main: #2b2825;       /* Графитово-коричневый */
            --text-muted: #726c65;      /* Приглушенный теплый */
            --accent-lavender: #bfa8e2;  /* Нежная лаванда */
            --border-color: #eee9e0;     /* Мягкие границы */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 19px;
            margin: 0 0 6px 0;
            color: var(--text-main);
            font-weight: 700;
        }

        .header h2 {
            font-size: 15px;
            font-weight: 500;
            margin: 0 0 10px 0;
            color: var(--accent-lavender);
            background: rgba(191, 168, 226, 0.15);
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .header p {
            font-size: 13px;
            color: var(--text-muted);
            margin: 0;
            font-style: italic;
            line-height: 1.4;
        }

        .services-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .service-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--card-shadow);
            transition: transform 0.1s, border-color 0.2s;
        }

        .service-card:active {
            transform: scale(0.99);
        }

        .service-card input[type="checkbox"] {
            margin-top: 3px;
            accent-color: var(--btn-gold);
            width: 18px;
            height: 18px;
        }

        .service-info {
            flex-grow: 1;
        }

        .service-title {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 4px;
            color: var(--text-main);
        }

        .service-desc {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.3;
        }

        .service-price {
            font-weight: 700;
            color: var(--btn-gold);
            font-size: 15px;
            white-space: nowrap;
        }

        .form-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 90px;
            box-shadow: 0 4px 12px var(--card-shadow);
        }

        .form-section h3 {
            font-size: 13px;
            margin: 0 0 12px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 4px;
            color: var(--text-muted);
        }

        .input-group input, .input-group textarea {
            width: 100%;
            padding: 11px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }

        .input-group input:focus, .input-group textarea:focus {
            border-color: var(--accent-lavender);
        }

        .footer-action {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--bg-color);
            border-top: 1px solid var(--border-color);
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.03);
        }

        .total-price {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
        }

        .btn-submit {
            background-color: var(--btn-gold);
            color: #ffffff;
            font-weight: 600;
            border: none;
            padding: 12px 22px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 0 3px 8px rgba(198, 162, 88, 0.3);
            transition: background-color 0.2s;
        }

        .btn-submit:active {
            background-color: var(--btn-gold-hover);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Современный мистицизм - Таємниці Долі</h1>
        <h2>Вас вітає Корнелія 👩🏻‍💻</h2>
        <p>Ваші відповіді вже існують. Залишилося лише поставити правильне запитання.</p>
    </div>

    <div class="services-list">
        <label class="service-card">
            <input type="checkbox" value="150" data-name="Любов і стосунки" onchange="calculateTotal()">
            <div class="service-info">
                <div class="service-title">❤️ Любов і стосунки</div>
                <div class="service-desc">Почуття, наміри, перспектива розвитку взаємин</div>
            </div>
            <div class="service-price">150 грн</div>
        </label>

        <label class="service-card">
            <input type="checkbox" value="100" data-name="Кар’єра та фінанси" onchange="calculateTotal()">
            <div class="service-info">
                <div class="service-title">💰 Кар’єра та фінанси</div>
                <div class="service-desc">Робота, покликання, нові можливості та фінансовий потік</div>
            </div>
            <div class="service-price">100 грн</div>
        </label>

        <label class="service-card">
            <input type="checkbox" value="200" data-name="Карма та призначення" onchange="calculateTotal()">
            <div class="service-info">
                <div class="service-title">🌙 Карма та призначення</div>
                <div class="service-desc">Життєві уроки, духовний шлях і призначення душі</div>
            </div>
            <div class="service-price">200 грн</div>
        </label>

        <label class="service-card">
            <input type="checkbox" value="300" data-name="Великий прогноз на 3 місяці" onchange="calculateTotal()">
            <div class="service-info">
                <div class="service-title">✨ Великий прогноз на 3 місяці</div>
                <div class="service-desc">Детальний прогноз на всі сфери життя</div>
            </div>
            <div class="service-price">300 грн</div>
        </label>
    </div>

    <div class="form-section">
        <h3>Дані для розкладу</h3>
        <div class="input-group">
            <label>Ваше ім'я *</label>
            <input type="text" id="client-name" placeholder="Наприклад: Анна">
        </div>
        <div class="input-group">
            <label>Дата народження *</label>
            <input type="text" id="client-dob" placeholder="ДД.ММ.ГГГГ">
        </div>
        <div class="input-group">
            <label>Ваше запитання (за бажанням)</label>
            <textarea id="client-question" rows="2" placeholder="Опишіть ваші думки або конкретну ситуацію..."></textarea>
        </div>
    </div>

    <div class="footer-action">
        <div class="total-price">Разом: <span id="total-val">0</span> грн</div>
        <button class="btn-submit" id="submit-btn" onclick="sendOrder()">Підтверджую заказ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function calculateTotal() {
            const checkboxes = document.querySelectorAll('.service-card input[type="checkbox"]:checked');
            let total = 0;
            checkboxes.forEach(cb => {
                total += parseInt(cb.value);
            });
            document.getElementById('total-val').innerText = total;
        }

        function sendOrder() {
            const name = document.getElementById('client-name').value.trim();
            const dob = document.getElementById('client-dob').value.trim();
            const question = document.getElementById('client-question').value.trim();

            const selectedCheckboxes = document.querySelectorAll('.service-card input[type="checkbox"]:checked');

            if (selectedCheckboxes.length === 0) {
                alert("Будь ласка, оберіть хоча б одну послугу.");
                return;
            }

            if (!name || !dob) {
                alert("Будь ласка, вкажіть ваше ім'я та дату народження.");
                return;
            }

            let selectedServices = [];
            let total = 0;
            selectedCheckboxes.forEach(cb => {
                selectedServices.push(cb.getAttribute('data-name'));
                total += parseInt(cb.value);
            });

            const payload = {
                client_name: name,
                client_dob: dob,
                client_question: question || "Без питання",
                services: selectedServices,
                total_amount: total
            };

            tg.sendData(JSON.stringify(payload));
        }
    </script>
</body>
</html>
