<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таємниці Долі | Головна</title>
    <style>
        :root {
            --bg-color: #f7f4ee;
            --card-bg: #ffffff;
            --card-shadow: rgba(180, 170, 160, 0.2);
            --btn-gold: #c6a258;
            --btn-gold-hover: #b59247;
            --text-main: #2b2825;
            --text-muted: #726c65;
            --border-color: #e6dfd3;
            --accent-purple: #4a3366;
            --green-color: #4a7c59;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
            margin-top: 8px;
        }

        .header h2 {
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 6px 0;
            color: var(--accent-purple);
            background: rgba(191, 168, 226, 0.3);
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
        }

        .section-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: var(--btn-gold);
        }

        .services-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .service-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px 16px;
            box-shadow: 0 4px 12px var(--card-shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .service-card:hover {
            border-color: var(--btn-gold);
        }

        .service-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .service-card input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--btn-gold);
            cursor: pointer;
        }

        .service-info .title {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .service-info .desc {
            font-size: 12px;
            color: var(--text-muted);
        }

        .service-price {
            font-weight: 700;
            color: var(--btn-gold);
            font-size: 14px;
            white-space: nowrap;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--btn-gold);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(198, 162, 88, 0.3);
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: var(--btn-gold-hover);
        }

        /* Экран подтверждения (скрыт по умолчанию) */
        #success-screen {
            display: none;
            text-align: center;
            padding: 20px 10px;
        }

        .success-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .success-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 4px 12px var(--card-shadow);
            margin-bottom: 20px;
            text-align: left;
        }

        .success-card p {
            margin: 8px 0;
            font-size: 14px;
            color: var(--text-muted);
        }

        .success-card span {
            color: var(--text-main);
            font-weight: 600;
        }

        .btn-cabinet {
            display: block;
            width: 100%;
            background-color: var(--accent-purple);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
            box-shadow: 0 4px 12px rgba(74, 51, 102, 0.3);
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- ОСНОВНАЯ ФОРМА -->
    <div id="order-form-container">
        <div class="header">
            <h2>Таємниці Долі ✨</h2>
        </div>

        <div class="form-group">
            <div class="section-title">Ваші дані</div>
            <input type="text" class="form-input" placeholder="Ваше ім'я" id="client-name">
        </div>
        
        <div class="form-group">
            <input type="text" class="form-input" placeholder="Дата народження (ДД.ММ.РРРР)" id="client-dob">
        </div>

        <div class="section-title">Оберіть послуги</div>

        <div class="services-list">
            <label class="service-card">
                <div class="service-left">
                    <input type="checkbox" name="service" value="250" data-name="Любов і стосунки">
                    <div class="service-info">
                        <div class="title">Любов і стосунки</div>
                        <div class="desc">Аналіз почуттів та сумісності</div>
                    </div>
                </div>
                <div class="service-price">250 грн</div>
            </label>

            <label class="service-card">
                <div class="service-left">
                    <input type="checkbox" name="service" value="250" data-name="Кар’єра та фінанси">
                    <div class="service-info">
                        <div class="title">Кар’єра та фінанси</div>
                        <div class="desc">Перспективи заробітку і росту</div>
                    </div>
                </div>
                <div class="service-price">250 грн</div>
            </label>

            <label class="service-card">
                <div class="service-left">
                    <input type="checkbox" name="service" value="300" data-name="Великий прогноз">
                    <div class="service-info">
                        <div class="title">Великий прогноз</div>
                        <div class="desc">Розклад на найближчі 3 місяці</div>
                    </div>
                </div>
                <div class="service-price">300 грн</div>
            </label>
        </div>

        <div class="form-group">
            <div class="section-title">Ваше запитання (необов'язково)</div>
            <input type="text" class="form-input" placeholder="Напишіть головне питання..." id="client-question">
        </div>

        <button class="btn-submit" onclick="submitOrder()">Оформити замовлення</button>
    </div>

    <!-- ЭКРАН ПОДТВЕРЖДЕНИЯ (ПОСЛЕ ЗАКАЗА) -->
    <div id="success-screen">
        <div class="header">
            <h2>Підтвердження замовлення 🎉</h2>
        </div>
        <div class="success-icon">🔮</div>
        
        <div class="success-card">
            <p>Ім'я: <span id="res-name">-</span></p>
            <p>Дата народження: <span id="res-dob">-</span></p>
            <p>Обрані послуги: <span id="res-services">-</span></p>
            <p>Сума до сплати: <span id="res-total" style="color: var(--btn-gold); font-weight: 700;">0 грн</span></p>
        </div>

        <button class="btn-submit" onclick="alert('Перехід до оплати...')">Перейти до оплати</button>
        <a href="cabinet.html" class="btn-cabinet">Перейти в особистий кабінет</a>
    </div>

    <script>
        function submitOrder() {
            const name = document.getElementById('client-name').value;
            const dob = document.getElementById('client-dob').value;
            
            if (!name) {
                alert('Будь ласка, введіть ваше ім\'я');
                return;
            }

            const checkboxes = document.querySelectorAll('input[name="service"]:checked');
            if (checkboxes.length === 0) {
                alert('Оберіть хоча б одну послугу');
                return;
            }

            let total = 0;
            let serviceNames = [];
            checkboxes.forEach(cb => {
                total += parseInt(cb.value);
                serviceNames.push(cb.getAttribute('data-name'));
            });

            // Заполняем данные на экране подтверждения
            document.getElementById('res-name').textContent = name;
            document.getElementById('res-dob').textContent = dob || 'Не вказано';
            document.getElementById('res-services').textContent = serviceNames.join(', ');
            document.getElementById('res-total').textContent = total + ' грн';

            // Переключаем экраны
            document.getElementById('order-form-container').style.display = 'none';
            document.getElementById('success-screen').style.display = 'block';
        }
    </script>
</body>
</html>
