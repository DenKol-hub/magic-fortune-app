<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таємниці долі</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #f7f4ee;
            --card-bg: #ffffff;
            --card-shadow: rgba(180, 170, 160, 0.15);
            --btn-gold: #c6a258;
            --text-main: #2b2825;
            --text-muted: #726c65;
            --accent-purple: #e9e3f0;
            --border-color: #eee9e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .header-greeting {
            background-color: var(--accent-purple);
            color: #4a3366;
            text-align: center;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 600;
            margin: 10px auto 20px auto;
            width: fit-content;
        }

        .tab-navigation {
            display: flex;
            background: #e6dfd3;
            border-radius: 12px;
            padding: 3px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
        }

        .tab-btn.active {
            background: #ffffff;
            color: var(--text-main);
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .form-section {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 12px var(--card-shadow);
        }

        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 700;
        }

        .input-group { margin-bottom: 10px; }
        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            background-color: #fcfbf9;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }

        .service-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .service-left { display: flex; align-items: center; gap: 10px; }
        .service-left input { accent-color: var(--btn-gold); width: 18px; height: 18px; }

        .service-price { font-weight: 700; color: var(--btn-gold); font-size: 14px; }

        .days-selector { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
        .day-btn {
            min-width: 42px;
            padding: 8px 4px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: #fff;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .day-btn.selected { background: #bfa8e2; color: #fff; border-color: #bfa8e2; }

        .footer-action {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background-color: var(--bg-color);
            border-top: 1px solid var(--border-color);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-submit {
            background-color: var(--btn-gold);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 340px;
            text-align: center;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="header-greeting">Вас вітає Корнелія ✨</div>

    <div class="tab-navigation">
        <button class="tab-btn active" id="btn-tab-order" onclick="switchTab('order')">Запис</button>
        <button class="tab-btn" id="btn-tab-profile" onclick="switchTab('profile')">Кабінет</button>
    </div>

    <div id="tab-order">
        <div class="form-section">
            <div class="section-title">ВАШІ ДАНІ</div>
            <div class="input-group">
                <input type="text" id="client-name" placeholder="Ваше ім'я">
            </div>
            <div class="input-group">
                <input type="text" id="client-dob" placeholder="Дата народження (ДД.ММ.РРРР)">
            </div>
        </div>

        <div class="form-section">
            <div class="section-title">ОБЕРІТЬ ПОСЛУГИ</div>
            <label class="service-card">
                <div class="service-left">
                    <input type="checkbox" value="250" data-name="Любов і стосунки" onchange="calculateTotal()">
                    <span>Любов і стосунки</span>
                </div>
                <div class="service-price">250 грн</div>
            </label>
            <label class="service-card">
                <div class="service-left">
                    <input type="checkbox" value="250" data-name="Кар’єра та фінанси" onchange="calculateTotal()">
                    <span>Кар’єра та фінанси</span>
                </div>
                <div class="service-price">250 грн</div>
            </label>
            <label class="service-card">
                <div class="service-left">
                    <input type="checkbox" value="300" data-name="Великий прогноз" onchange="calculateTotal()">
                    <span>Великий прогноз</span>
                </div>
                <div class="service-price">300 грн</div>
            </label>
        </div>

        <div class="form-section">
            <div class="section-title">ОБЕРІТЬ ДЕНЬ (БЛИЖЧИЙ ТИЖДЕНЬ)</div>
            <div class="days-selector" id="days-box">
                <div class="day-btn selected" onclick="selectDay(this, 'Нд')">Нд</div>
                <div class="day-btn" onclick="selectDay(this, 'Пн')">Пн</div>
                <div class="day-btn" onclick="selectDay(this, 'Вт')">Вт</div>
                <div class="day-btn" onclick="selectDay(this, 'Ср')">Ср</div>
                <div class="day-btn" onclick="selectDay(this, 'Чт')">Чт</div>
                <div class="day-btn" onclick="selectDay(this, 'Пт')">Пт</div>
                <div class="day-btn" onclick="selectDay(this, 'Сб')">Сб</div>
            </div>

            <div class="section-title" style="margin-top: 15px;">ОБЕРІТЬ ЧАС (30 ХВ)</div>
            <div class="input-group">
                <select id="consultation-time">
                    <option value="">Оберіть час...</option>
                    <option value="10:00 - 10:30">10:00 - 10:30</option>
                    <option value="10:30 - 11:00">10:30 - 11:00</option>
                    <option value="11:00 - 11:30">11:00 - 11:30</option>
                    <option value="11:30 - 12:00">11:30 - 12:00</option>
                    <option value="14:00 - 14:30">14:00 - 14:30</option>
                    <option value="14:30 - 15:00">14:30 - 15:00</option>
                    <option value="15:00 - 15:30">15:00 - 15:30</option>
                    <option value="16:00 - 16:30">16:00 - 16:30</option>
                </select>
            </div>
        </div>

        <div class="footer-action">
            <div style="font-size: 16px; font-weight: bold;">Сума: <span id="total-val">0</span> грн</div>
            <button class="btn-submit" onclick="openModal()">Замовити</button>
        </div>
    </div>

    <div id="tab-profile" class="hidden">
        <div class="form-section">
            <div class="section-title">📜 ІСТОРІЯ ЗАМОВЛЕНЬ</div>
            <div id="orders-history-container">
                <p style="font-size: 13px; color: var(--text-muted); text-align: center;">Немає активних замовлень.</p>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="payment-modal">
        <div class="modal-card">
            <h3>💳 Оплата замовлення</h3>
            <p style="font-size: 13px; color: var(--text-muted);">Сума: <strong id="modal-sum">0</strong> грн</p>
            <div style="background: #f7f4ee; padding: 10px; border-radius: 8px; font-weight: bold; margin: 10px 0;">
                4441 1110 5176 5877
            </div>
            
            <div class="input-group" style="text-align: left; margin-top: 15px;">
                <label style="font-size: 11px; color: var(--text-muted);">Прикріпіть квитанцію (файл/скрин):</label>
                <input type="file" id="receipt-file">
            </div>

            <button class="btn-submit" style="width: 100%; margin-top: 10px;" onclick="submitOrder()">Надіслати</button>
            <button onclick="closeModal()" style="background:none; border:none; margin-top:10px; color: var(--text-muted); cursor:pointer;">Скасувати</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        let selectedDay = 'Нд';
        let userOrders = [];

        function selectDay(el, day) {
            document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
            selectedDay = day;
        }

        function switchTab(tab) {
            document.getElementById('tab-order').classList.toggle('hidden', tab !== 'order');
            document.getElementById('tab-profile').classList.toggle('hidden', tab !== 'profile');
            document.getElementById('btn-tab-order').classList.toggle('active', tab === 'order');
            document.getElementById('btn-tab-profile').classList.toggle('active', tab === 'profile');
        }

        function calculateTotal() {
            let total = 0;
            document.querySelectorAll('.service-card input:checked').forEach(c => total += parseInt(c.value));
            document.getElementById('total-val').innerText = total;
        }

        function openModal() {
            const name = document.getElementById('client-name').value;
            const dob = document.getElementById('client-dob').value;
            const time = document.getElementById('consultation-time').value;
            const total = document.getElementById('total-val').innerText;

            if (!name || !dob || !time || total === "0") {
                return alert("Заповніть усі поля та оберіть послугу!");
            }
            document.getElementById('modal-sum').innerText = total;
            document.getElementById('payment-modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('payment-modal').style.display = 'none'; }

        function submitOrder() {
            const file = document.getElementById('receipt-file').files[0];
            if (!file) return alert("Прикріпіть квитанцію!");

            const selectedServices = [];
            document.querySelectorAll('.service-card input:checked').forEach(c => selectedServices.push(c.getAttribute('data-name')));

            const orderData = {
                id: Math.floor(1000 + Math.random() * 9000),
                name: document.getElementById('client-name').value,
                dob: document.getElementById('client-dob').value,
                day: selectedDay,
                time: document.getElementById('consultation-time').value,
                services: selectedServices,
                total: document.getElementById('total-val').innerText,
                status: 'Очікує підтвердження ⏳'
            };

            userOrders.unshift(orderData);
            renderHistory();

            if (tg && tg.sendData) {
                tg.sendData(JSON.stringify(orderData));
            }

            closeModal();
            alert("Дякуємо! Замовлення надіслано.");
        }

        function renderHistory() {
            const box = document.getElementById('orders-history-container');
            box.innerHTML = '';
            userOrders.forEach(o => {
                box.innerHTML += `
                    <div style="border:1px solid #eee9e0; border-radius:10px; padding:10px; margin-bottom:10px;">
                        <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:13px;">
                            <span>#${o.id} (${o.day}, ${o.time})</span>
                            <span style="color:#c6a258">${o.status}</span>
                        </div>
                        <div style="font-size:12px; color:#726c65; margin-top:4px;">
                            ${o.services.join(', ')} — <strong>${o.total} грн</strong>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
