<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Особистий кабінет | Таємниці Долі</title>
    <style>
        :root {
            --bg-color: #f7f4ee;
            --card-bg: #ffffff;
            --card-shadow: rgba(180, 170, 160, 0.2);
            --btn-gold: #c6a258;
            --text-main: #2b2825;
            --text-muted: #726c65;
            --border-color: #e6dfd3;
            --accent-purple: #4a3366;
            --green-color: #4a7c59;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
            margin-top: 8px;
        }

        .header h2 {
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 6px 0;
            color: var(--accent-purple);
            background: rgba(191, 168, 226, 0.3);
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
        }

        #auth-screen {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 4px 12px var(--card-shadow);
            margin-top: 40px;
            text-align: center;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 12px;
            outline: none;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--btn-gold);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        #cabinet-content { display: none; }

        .profile-card, .history-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 4px 12px var(--card-shadow);
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="header" style="margin-top:0;">
            <h2>Вхід у кабінет 🔒</h2>
        </div>
        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">Введіть ваш Email для верифікації:</p>
        <input type="email" class="form-input" placeholder="Ваш Email" id="auth-email">
        <button class="btn-submit" onclick="verifyEmail()">Увійти</button>
    </div>

    <div id="cabinet-content">
        <div class="header">
            <h2>Особистий кабінет 🔮</h2>
        </div>

        <div class="profile-card">
            <h3 id="user-name" style="margin:0 0 4px 0; font-size:16px;">Ім'я</h3>
            <p style="margin:0; font-size:13px; color: var(--text-muted);" id="user-email">email@mail.com</p>
        </div>

        <div style="font-size: 14px; text-transform: uppercase; color: var(--text-muted); font-weight: 600; margin-bottom: 12px;">Історія замовлень</div>
        <div id="orders-history">
            <!-- Динамически -->
        </div>
    </div>

    <script>
        function verifyEmail() {
            const email = document.getElementById('auth-email').value;
            if(!email) return alert('Введіть email');

            fetch('/api/auth', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    document.getElementById('user-name').textContent = data.user.name;
                    document.getElementById('user-email').textContent = data.user.email;
                    document.getElementById('auth-screen').style.display = 'none';
                    document.getElementById('cabinet-content').style.display = 'block';
                } else {
                    alert(data.error);
                }
            });
        }
    </script>
</body>
</html>
