<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель Управління</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #f7f4ee;
            --card-bg: #ffffff;
            --card-shadow: rgba(180, 170, 160, 0.15);
            --btn-gold: #c6a258;
            --btn-danger: #d9534f;
            --btn-success: #5cb85c;
            --text-main: #2b2825;
            --text-muted: #726c65;
            --border-color: #eee9e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
        }

        .header-title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #4a3366;
            margin-bottom: 16px;
        }

        .order-card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 4px 10px var(--card-shadow);
            border: 1px solid var(--border-color);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .order-status {
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 6px;
            background: #e6dfd3;
        }

        .info-row {
            font-size: 13px;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .info-row span {
            color: var(--text-muted);
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }

        .btn-approve { background: var(--btn-success); color: white; }
        .btn-reject { background: var(--btn-danger); color: white; }
        .btn-chat { background: #bfa8e2; color: #4a3366; }
        .btn-ban { background: #333; color: white; }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <div class="header-title">📊 Пул Замовлень</div>

    <div id="orders-list">
        </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        // Функція надсилання дії назад у бот
        function sendAdminAction(action, orderId, userId) {
            const data = {
                admin_action: action,
                order_id: orderId,
                user_id: userId
            };

            if (tg && tg.sendData) {
                tg.sendData(JSON.stringify(data));
            } else {
                alert(`Дія: ${action} для замовлення #${orderId}`);
            }
        }
    </script>
</body>
</html>
