<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ Панель</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
    }

    h2, h3 { color: #bb86fc; }

    .card {
      background: #1e1e1e;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 16px;
      border: 1px solid #333;
    }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: white;
      box-sizing: border-box;
    }

    button.btn-action {
      background: #bb86fc;
      color: black;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }

    button.btn-ban { background: #cf6679; color: white; border: none; }
    button.btn-done { background: #03dac6; color: black; border: none; }

    .order-img { max-width: 100%; border-radius: 6px; margin-top: 8px; }
  </style>
</head>
<body>

  <h2>👑 Админ-Панель</h2>
  
  <!-- Статистика -->
  <div class="card grid">
    <div>Всего заказов: <b id="stat-orders">0</b></div>
    <div>Выручка: <b id="stat-revenue">0</b> грн</div>
  </div>

  <!-- Управление слотами созвонов -->
  <div class="card">
    <h3>📅 Добавить слот созвона</h3>
    <input type="date" id="slot-date">
    <input type="text" id="slot-time" placeholder="Пример: 14:00 - 14:40">
    <button class="btn-action" onclick="addSlot()">Добавить слот</button>
  </div>

  <!-- Список заказов -->
  <h3>📥 Активные и новые заказы</h3>
  <div id="orders-list"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    const API_URL = window.location.origin;

    // Загрузка админ-данных
    async function loadAdminData() {
      const res = await fetch(`${API_URL}/api/admin/data`);
      const data = await res.json();

      document.getElementById('stat-orders').innerText = data.stats.total_orders;
      document.getElementById('stat-revenue').innerText = data.stats.total_revenue;

      const container = document.getElementById('orders-list');
      container.innerHTML = '';

      data.orders.forEach(o => {
        const card = document.createElement('div');
        card.className = 'card';

        let photoHTML = o.client_photo ? `<br><b>Фото клиента:</b><br><img src="${API_URL}${o.client_photo}" class="order-img">` : '';

        card.innerHTML = `
          <h4>Заказ #${o.order_id} — ${o.name} (@${o.username})</h4>
          <p>🆔 ID: ${o.user_id} | ДР: ${o.dob}</p>
          <p>🔮 Услуги: <b>${o.services}</b> (${o.total} грн)</p>
          <p>📞 Созвон: <b>${o.slot}</b></p>
          <p>💬 Вопрос: <i>${o.question}</i></p>
          ${photoHTML}
          <hr style="border-color:#333;">

          <!-- Форма ответа -->
          <textarea id="reply-text-${o.order_id}" placeholder="Текст ответа клиенту..."></textarea>
          <label style="font-size:12px; color:#aaa;">Прикрепить фото расклада:</label>
          <input type="file" id="reply-photo-${o.order_id}" accept="image/*">
          
          <div class="grid" style="margin-top: 10px;">
            <button class="btn-action" onclick="sendReply(${o.order_id})">✉️ Отправить ответ</button>
            <button class="btn-done" onclick="completeOrder(${o.order_id})">✅ Завершить</button>
          </div>
          <button class="btn-ban" style="margin-top:8px;" onclick="banUser(${o.user_id})">⛔ Заблокировать</button>
        `;
        container.appendChild(card);
      });
    }

    // Добавление слота
    async function addSlot() {
      const date = document.getElementById('slot-date').value;
      const time = document.getElementById('slot-time').value;

      const formData = new FormData();
      formData.append('slot_date', date);
      formData.append('slot_time', time);

      await fetch(`${API_URL}/api/admin/slots/add`, { method: 'POST', body: formData });
      alert('Слот добавлен!');
    }

    // Отправка ответа пользователю
    async function sendReply(orderId) {
      const text = document.getElementById(`reply-text-${orderId}`).value;
      const photoFile = document.getElementById(`reply-photo-${orderId}`).files[0];

      const formData = new FormData();
      formData.append('order_id', orderId);
      formData.append('text', text);
      if (photoFile) formData.append('reply_photo', photoFile);

      const res = await fetch(`${API_URL}/api/admin/reply`, { method: 'POST', body: formData });
      const data = await res.json();
      if(data.status === 'ok') {
        alert('Ответ отправлен клиенту в бот и добавлен в ЛК!');
        loadAdminData();
      }
    }

    // Завершить заказ
    async function completeOrder(orderId) {
      const formData = new FormData();
      formData.append('order_id', orderId);
      await fetch(`${API_URL}/api/admin/complete-order`, { method: 'POST', body: formData });
      loadAdminData();
    }

    // Забанить
    async function banUser(userId) {
      await fetch(`${API_URL}/api/admin/ban`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: userId, action: 'ban' })
      });
      alert('Забанен!');
      loadAdminData();
    }

    loadAdminData();
  </script>
</body>
</html>
