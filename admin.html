<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель Управління</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #f7f4ee;
            --card-bg: #ffffff;
            --card-shadow: rgba(180, 170, 160, 0.15);
            --btn-gold: #c6a258;
            --btn-danger: #d9534f;
            --btn-success: #28a745;
            --text-main: #2b2825;
            --text-muted: #726c65;
            --border-color: #eee9e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
        }

        .header-title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #4a3366;
            margin-bottom: 16px;
        }

        .order-card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 4px 10px var(--card-shadow);
            border: 1px solid var(--border-color);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .order-status {
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 6px;
            background: #e6dfd3;
        }

        .info-row {
            font-size: 13px;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .info-row span {
            color: var(--text-muted);
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
        }

        .btn-approve { background: var(--btn-success); color: white; }
        .btn-reject { background: var(--btn-danger); color: white; }
        .btn-chat { background: #bfa8e2; color: #4a3366; display: block; text-decoration: none; }
        .btn-ban { background: #333; color: white; }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <div class="header-title">📊 Пул Замовлень</div>

    <div id="orders-list">
        <div class="empty-state">Завантаження замовлень...</div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        async function loadOrders() {
            try {
                const response = await fetch('/api/orders');
                const orders = await response.json();
                renderOrders(orders);
            } catch (e) {
                document.getElementById('orders-list').innerHTML = `<div class="empty-state">Помилка завантаження даних</div>`;
            }
        }

        function renderOrders(orders) {
            const container = document.getElementById('orders-list');
            if (!orders || orders.length === 0) {
                container.innerHTML = `<div class="empty-state">Пул замовлень порожній</div>`;
                return;
            }

            container.innerHTML = '';
            orders.forEach(o => {
                const chatUrl = o.username ? `https://t.me/${o.username}` : `tg://user?id=${o.user_id}`;
                container.innerHTML += `
                    <div class="order-card">
                        <div class="order-header">
                            <span>Замовлення #${o.id}</span>
                            <span class="order-status">${o.status}</span>
                        </div>
                        <div class="info-row"><span>Клієнт:</span> <strong>${o.name}</strong> (@${o.username || 'без_юзернейму'})</div>
                        <div class="info-row"><span>Дата народження:</span> ${o.dob}</div>
                        <div class="info-row"><span>Слот:</span> ${o.day}, ${o.time}</div>
                        <div class="info-row"><span>Послуги:</span> ${o.services.join(', ')}</div>
                        <div class="info-row"><span>Сума:</span> <strong>${o.total} грн</strong></div>

                        <div class="action-buttons">
                            <div class="btn-row">
                                <button class="btn btn-approve" onclick="sendAction('approve', ${o.id}, ${o.user_id})">✅ Апрув</button>
                                <button class="btn btn-reject" onclick="sendAction('reject', ${o.id}, ${o.user_id})">❌ Відхилити</button>
                            </div>
                            <div class="btn-row">
                                <a href="${chatUrl}" class="btn btn-chat" target="_blank">💬 Написати / 📞 Дзвінок</a>
                                <button class="btn btn-ban" onclick="sendAction('ban', ${o.id}, ${o.user_id})">🚫 Бан</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        async function sendAction(action, orderId, userId) {
            try {
                await fetch('/api/admin-action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action, order_id: orderId, user_id: userId })
                });
                alert('Дію виконано!');
                loadOrders();
            } catch(e) {
                alert('Помилка виконання дії');
            }
        }

        loadOrders();
    </script>
</body>
</html>
