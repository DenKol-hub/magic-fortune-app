<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель Управління</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #f7f4ee;         /* Молочно-кремовый фон */
            --card-bg: #ffffff;         /* Белые карточки */
            --card-shadow: rgba(180, 170, 160, 0.15); /* Легкая тень */
            --btn-gold: #c6a258;        /* Матовое золото */
            --btn-gold-hover: #b59247;  
            --text-main: #2b2825;       /* Темный графитовый */
            --text-muted: #726c65;      /* Приглушенный */
            --accent-lavender: #bfa8e2;  /* Нежная лаванда */
            --border-color: #eee9e0;     
            --danger-color: #e74c3c;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            padding-bottom: 30px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
            margin-top: 8px;
        }

        .header h2 {
            font-size: 16px;
            font-weight: 600;
            margin: 0 0 10px 0;
            color: #4a3366;
            background: rgba(191, 168, 226, 0.25);
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            text-align: center;
            box-shadow: 0 4px 12px var(--card-shadow);
        }

        .stat-val {
            font-size: 18px;
            font-weight: 700;
            color: var(--btn-gold);
        }

        .stat-lbl {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 24px;
            box-shadow: 0 4px 12px var(--card-shadow);
        }

        .form-section h3 {
            font-size: 13px;
            margin: 0 0 12px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .input-group { margin-bottom: 12px; }

        .input-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 4px;
            color: var(--text-muted);
        }

        .input-group input {
            width: 100%;
            padding: 11px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }

        .ban-btn-row {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            flex: 1;
            background-color: var(--btn-gold);
            color: #ffffff;
            font-weight: 600;
            border: none;
            padding: 11px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            text-align: center;
        }

        .btn-action.danger {
            background-color: var(--danger-color);
        }

        .order-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 12px var(--card-shadow);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--border-color);
        }

        .order-price {
            color: var(--btn-gold);
            font-weight: 700;
        }

        .order-info {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .order-info strong {
            color: var(--text-main);
        }

        .order-question {
            background: var(--bg-color);
            padding: 8px 10px;
            border-radius: 8px;
            font-style: italic;
            margin-top: 6px;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Панель Управління 👑</h2>
    </div>

    <!-- СТАТИСТИКА -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-val" id="st-revenue">0 грн</div>
            <div class="stat-lbl">Загальний виторг</div>
        </div>
        <div class="stat-card">
            <div class="stat-val" id="st-orders">0</div>
            <div class="stat-lbl">Виконано замовлень</div>
        </div>
    </div>

    <!-- УПРАВЛЕНИЕ БАНАМИ -->
    <div class="form-section">
        <h3>⛔ Управління блокуваннями</h3>
        <div class="input-group">
            <label>Telegram ID користувача</label>
            <input type="number" id="ban-id-input" placeholder="Наприклад: 123456789">
        </div>
        <div class="ban-btn-row">
            <button class="btn-action danger" onclick="manualBan('ban')">Заблокувати</button>
            <button class="btn-action" onclick="manualBan('unban')">Розблокувати</button>
        </div>
    </div>

    <!-- АКТИВНЫЕ ЗАКАЗЫ -->
    <div class="form-section" style="margin-bottom: 0;">
        <h3>📋 Активні замовлення</h3>
        <div id="orders-container">
            <p style="text-align: center; color: var(--text-muted); font-size: 13px;">Завантаження...</p>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const BACKEND_URL = "https://magic-bot-backend-ym8f.onrender.com";

        async function loadAdminData() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/admin/data`);
                const data = await res.json();

                document.getElementById('st-revenue').innerText = `${data.stats.total_revenue} грн`;
                document.getElementById('st-orders').innerText = data.stats.total_orders;

                const container = document.getElementById('orders-container');
                container.innerHTML = '';

                if (!data.active_orders || data.active_orders.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: var(--text-muted); font-size: 13px; margin: 10px 0;">Активних замовлень немає ✨</p>';
                    return;
                }

                data.active_orders.forEach(order => {
                    const card = document.createElement('div');
                    card.className = 'order-card';
                    card.innerHTML = `
                        <div class="order-header">
                            <span>${order.name} (${order.username})</span>
                            <span class="order-price">${order.total} грн</span>
                        </div>
                        <div class="order-info">
                            <b>ID:</b> <code>${order.user_id}</code> | <b>Вік:</b> ${order.age} (ДН: ${order.dob})<br>
                            <b>Послуги:</b> ${order.services.join(', ')}
                            <div class="order-question">"${order.question}"</div>
                        </div>
                        <button class="btn-action danger" style="width: 100%;" onclick="banUser(${order.user_id})">Заблокувати клієнта</button>
                    `;
                    container.appendChild(card);
                });

            } catch (err) {
                console.error("Помилка завантаження даних:", err);
            }
        }

        async function banUser(userId) {
            if (!confirm(`Ви точно бажаєте заблокувати ID: ${userId}?`)) return;

            await fetch(`${BACKEND_URL}/api/admin/ban`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, action: 'ban' })
            });

            loadAdminData();
        }

        async function manualBan(action) {
            const input = document.getElementById('ban-id-input');
            const uid = input.value.trim();
            if (!uid) return alert("Введіть Telegram ID!");

            await fetch(`${BACKEND_URL}/api/admin/ban`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: uid, action: action })
            });

            alert(`Дія "${action}" для ID ${uid} виконана.`);
            input.value = '';
            loadAdminData();
        }

        loadAdminData();
        setInterval(loadAdminData, 10000);
    </script>
</body>
</html>
