<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін-панель | Таємниці Долі</title>
    <style>
        :root {
            --bg-color: #f7f4ee;
            --card-bg: #ffffff;
            --card-shadow: rgba(180, 170, 160, 0.2);
            --btn-gold: #c6a258;
            --text-main: #2b2825;
            --text-muted: #726c65;
            --border-color: #e6dfd3;
            --green-color: #4a7c59;
            --accent-purple: #4a3366;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
            margin-top: 8px;
        }

        .header h2 {
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 6px 0;
            color: var(--accent-purple);
            background: rgba(191, 168, 226, 0.3);
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
        }

        .order-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 4px 12px var(--card-shadow);
            margin-bottom: 12px;
        }

        .order-actions {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            color: white;
        }

        .btn-complete { background-color: var(--green-color); }
        .btn-msg { background-color: var(--accent-purple); }
        .btn-cancel { background-color: #d9534f; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Адмін-панель ⚙️</h2>
    </div>

    <div id="admin-orders-list">
        <!-- Заказы подтягиваются из бэка -->
    </div>

    <script>
        fetch('/api/admin/orders')
            .then(res => res.json())
            .then(orders => {
                const list = document.getElementById('admin-orders-list');
                orders.forEach(o => {
                    list.innerHTML += `
                        <div class="order-card">
                            <div style="font-weight:600;">${o.client_name} (${o.client_email})</div>
                            <div style="font-size:13px; color:var(--text-muted)">Послуги: ${o.service_names}</div>
                            <div style="font-size:13px; color:var(--text-muted)">Час: ${o.slot_time} | Сума: ${o.total_price} грн</div>
                            <div style="font-size:13px; color:var(--btn-gold); font-weight:600;">Статус: ${o.status}</div>
                            <div class="order-actions">
                                <button class="btn-action btn-complete" onclick="updateOrder(${o.id}, 'complete')">Виконано</button>
                                <button class="btn-action btn-msg" onclick="alert('Відкриття чату/дзвінка через бота')">Зв'язок</button>
                                <button class="btn-action btn-cancel" onclick="updateOrder(${o.id}, 'cancel')">Скасувати</button>
                            </div>
                        </div>
                    `;
                });
            });

        function updateOrder(orderId, action) {
            fetch(`/api/admin/order/${orderId}`, {
                method: 'PATCH',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ action })
            }).then(() => location.reload());
        }
    </script>
</body>
</html>
